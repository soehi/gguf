name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: soehi/gguf (native + wasm-gc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Upstream serves no versioned toolchain artifacts: every
      # /binaries/<version>/... path answers 403 and only /binaries/latest/
      # resolves, so `bash -s <version>` fails inside install.sh's download.
      # The installer is therefore run bare; the next step pins the floor.
      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install Python fixture tooling
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numpy
        run: python -m pip install --disable-pip-version-check numpy

      # The generator belongs to this module, so the fixtures it produces are
      # this module's to keep in sync. Regenerating must leave them
      # byte-identical; a diff means the generator was edited without being
      # re-run.
      - name: Verify generated fixtures are up to date
        run: |
          python tools/gen_fixtures.py
          if ! git diff --exit-code -- src/gen_fixture_test.mbt src/tensor/gen_golden_test.mbt; then
            echo "::error::generated fixtures are stale; run 'python tools/gen_fixtures.py' and commit the result"
            exit 1
          fi

      # Since the installer can only fetch "latest", pin what actually matters
      # as a floor instead of an exact string: an exact match goes red on every
      # upstream release for no reason. Comparison is numeric, so 0.10.9 is
      # correctly below 0.10.16 and a future 0.11 or 1.0 still passes.
      # Last verified green: moon 0.1.20261028 / moonc v0.10.18.
      - name: Assert MoonBit toolchain
        run: |
          moon version
          moonc -v
          got=$(moonc -v | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')
          if [ -z "$got" ]; then
            echo "::error::could not parse a version out of 'moonc -v'"
            exit 1
          fi
          if ! awk -F. -v g="$got" 'BEGIN {
                split(g, a, ".");
                if (a[1] > 0 || a[2] > 10 || (a[2] == 10 && a[3] >= 16)) exit 0;
                exit 1
              }'; then
            echo "::error::moonc >= 0.10.16 required, got v$got"
            exit 1
          fi

      - name: Static check (native)
        run: moon check --target native

      - name: Static check (wasm-gc)
        run: moon check --target wasm-gc

      - name: Test (native)
        run: moon test --target native

      - name: Test (wasm-gc)
        run: moon test --target wasm-gc

      - name: Build (native)
        run: moon build --target native

      - name: Build (wasm-gc)
        run: moon build --target wasm-gc
